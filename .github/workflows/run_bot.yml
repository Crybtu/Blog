name: Blogger AI Bot Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai tenacity

      - name: Run Blogger AI Bot
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: python blogger_ai_bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Push Generated Articles to GitHub
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "AI Web Bot"
          git config --global user.email "bot@github.com"
          
          git clone https://${TOKEN}@://github.com public_folder
          
          cp index.html public_folder/
          cp archive.txt public_folder/ 2>/dev/null || true
          cp post_*.html public_folder/ 2>/dev/null || true
          
          cd public_folder
          git add .
          git commit -m "Publish new article to open archive" || exit 0
          git push
