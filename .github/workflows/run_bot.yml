name: Run AI Blog Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install google-genai
    - run: python blogger_ai_bot.py
    
    - name: Publish to Repository
      run: |
        git config --global user.name "AI Web Bot"
        git config --global user.email "bot@github.com"
        git add .
        git commit -m "تحديث ونشر مقال جديد بالأرشيف" || exit 0
        git push
