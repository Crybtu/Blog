name: Blogger AI Bot Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب المستودع الحالي مباشرة مع إعطائه صلاحيات كاملة للتعديل
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبات
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai tenacity

      # 4. تشغيل سكربت البوت لتوليد الملفات في نفس المجلد
      - name: Run Blogger AI Bot
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: python blogger_ai_bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 5. رفع الملفات الجديدة مباشرة دون الحاجة لأمر clone أو روابط
      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Web Bot"
          git config --global user.email "bot@github.com"
          
          # إضافة الملفات الجديدة إن وجدت مباشرة
          git add index.html archive.txt post_*.html 2>/dev/null || true
          
          # تنفيذ الحفظ والرفع التلقائي
          git commit -m "Publish new article to open archive" || exit 0
          git push
