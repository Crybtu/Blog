name: Run AI Blog Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - run: pip install google-genai
    
    - run: python blogger_ai_bot.py
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # نقل المقالات والأرشيف إلى مستودع المدونة المفتوح تلقائياً
    - name: Push to Public Blog Repo
      env:
        TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        git config --global user.name "AI Web Bot"
        git config --global user.email "bot@github.com"
        
        # الرابط النظيف والمصحح تماماً بدون أي رموز أو أقواس مكررة مكسورة
        git clone https://${TOKEN}@github.com{{ github.repository_owner }}/Blog.git public_folder
        
        cp index.html public_folder/
        cp archive.txt public_folder/ 2>/dev/null || true
        cp post_*.html public_folder/ 2>/dev/null || true
        
        cd public_folder
        git add .
        git commit -m "نشر مقال جديد بالأرشيف المفتوح" || exit 0
        git push
