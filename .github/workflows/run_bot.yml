name: Run AI Blog Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install google-genai
    - run: python blogger_ai_bot.py
    
    - name: Commit changes
      run: |
        git config --global user.name "AI Web Bot"
        git config --global user.email "bot@github.com"
        git add .
        git commit -m "تحديث الأرشيف" || exit 0
        git push
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy:
    needs: run-bot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
