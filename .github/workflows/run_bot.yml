name: Run Blogger AI Bot

on:
  workflow_dispatch: # لتشغيل البوت يدوياً بضغطة زر
  schedule:
    - cron: '0 9 * * *' # تشغيل تلقائي يومياً

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install google-generativeai google-api-python-client google-auth

    - name: Run Script
      run: python blogger_ai_bot.py
